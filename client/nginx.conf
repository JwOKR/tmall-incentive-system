server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Resolve API upstream dynamically
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API requests
    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA 入口：必须禁用缓存
    # index.html 里引用的是带内容 hash 的资源（assets/index-XXXX.css）。
    # 若它被浏览器缓存，发版后用户拿到的仍是旧 html → 继续加载旧 hash 的旧 JS/CSS，
    # 表现为「代码明明改了、镜像也重建了，但页面还是老样子」，只能靠手动硬刷新绕过。
    # 而 js/css 本身可放心强缓存 1 年：文件名带 hash，内容一变文件名就变。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}